name: shopslot-lakehouse

services:
  mysql:
    image: mysql:8.4.7
    command:
      - --server-id=223344
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=604800
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shopslot-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopslot}
      MYSQL_USER: ${MYSQL_USER:-shopslot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shopslot}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-shopslot}:${MYSQL_PASSWORD:-shopslot}@mysql:3306/${MYSQL_DATABASE:-shopslot}?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c
      "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/warehouse"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  debezium:
    image: quay.io/debezium/connect:3.0.0.Final
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: shopslot-connect
      CONFIG_STORAGE_TOPIC: _shopslot_connect_configs
      OFFSET_STORAGE_TOPIC: _shopslot_connect_offsets
      STATUS_STORAGE_TOPIC: _shopslot_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      REST_ADVERTISED_HOST_NAME: debezium
    ports:
      - "8083:8083"

  debezium-init:
    image: curlimages/curl:8.12.1
    depends_on:
      debezium:
        condition: service_started
    volumes:
      - ./debezium/outbox-router.json:/config/outbox-router.json:ro
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        until curl -fsS http://debezium:8083/ >/dev/null; do sleep 2; done
        curl -fsS -X PUT http://debezium:8083/connectors/shopslot-outbox/config \
          -H 'Content-Type: application/json' \
          --data @/config/outbox-router.json

  spark:
    image: apache/spark:3.5.6
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "4040:4040"
      - "8080:8080"
    volumes:
      - ./spark:/opt/spark/work-dir/spark:ro
    command: ["/bin/bash", "-lc", "tail -f /dev/null"]

  generator:
    build:
      context: ./generator
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopslot}
      MYSQL_USER: ${MYSQL_USER:-shopslot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shopslot}
    volumes:
      - ./generator:/app:ro
    profiles: ["tools"]

  api:
    build:
      context: .
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-shopslot}:${MYSQL_PASSWORD:-shopslot}@mysql:3306/${MYSQL_DATABASE:-shopslot}?charset=utf8mb4
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    profiles: ["api"]

volumes:
  mysql-data:
  redpanda-data:
  minio-data:
